    function wrapSvgText(text, maxChars = 22) {
      const words = String(text || '').split(/\s+/);
      const lines = [];
      let current = '';
      for (const w of words) {
        if ((current + ' ' + w).trim().length <= maxChars) {
          current = (current + ' ' + w).trim();
        } else {
          if (current) lines.push(current);
          current = w;
        }
      }
      if (current) lines.push(current);
      return lines.slice(0, 4);
    }

          <circle cx="265" cy="60" r="65" fill="rgba(255,255,255,0.08)"/>

          <rect x="220" y="24" width="56" height="22" rx="6" fill="rgba(0,0,0,0.28)"/>
          <text x="248" y="39" fill="#fef08a" font-family="Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DDC ${kodeDdc}</text>
          <text x="26" y="96" fill="rgba(255,255,255,0.85)" font-family="Arial,sans-serif" font-size="11" font-weight="bold">${th.badge}</text>
          <line x1="26" y1="108" x2="110" y2="108" stroke="#fde047" stroke-width="3"/>
          ${titleSvg}
          <rect x="26" y="285" width="248" height="1" fill="rgba(255,255,255,0.28)"/>
          <rect x="26" y="302" width="160" height="24" rx="12" fill="#ffffff"/>
          <text x="106" y="318" fill="${th.c1}" font-family="Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="middle">${safeJenjang}</text>
          <text x="26" y="362" fill="rgba(255,255,255,0.75)" font-family="Arial,sans-serif" font-size="10">Penulis / Penyusun:</text>
          <text x="26" y="380" fill="#ffffff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">${safeAuthor}</text>
        </svg>
      `;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function addDaysStr(dateStr, days) {
      const d = new Date(dateStr || todayStr());
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function formatTanggal(dateStr) {
      if (!dateStr) return '-';
      const parts = String(dateStr).slice(0, 10).split('-');
      if (parts.length !== 3) return dateStr;
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const mIdx = parseInt(parts[1], 10) - 1;
      return `${parts[2]} ${bulan[mIdx] || parts[1]} ${parts[0]}`;
    }

    function formatRupiah(num) {
      return 'Rp' + Number(num || 0).toLocaleString('id-ID');
    }

    function hitungHariTerlambat(batasKembali, tglKembaliAktual = null) {
      if (!batasKembali) return 0;
      const end = new Date(tglKembaliAktual || todayStr());
      const due = new Date(batasKembali);
      const diff = Math.floor((end - due) / (1000 * 60 * 60 * 24));
      return diff > 0 ? diff : 0;
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-rose-600 text-white border-rose-700',
        info: 'bg-[#18365d] text-white border-blue-900'
      };
      el.className = `px-4 py-3 rounded-xl shadow-lg border text-xs sm:text-sm font-semibold flex items-center gap-2.5 transition-all duration-300 ${colors[type] || colors.info}`;
      el.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${escapeHtml(msg)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 3400);
    }

    function initRealtimeListeners() {
      const bindCol = (colName, stateKey, sortFn = null) => {
        onSnapshot(pubCol(colName), (snapshot) => {
          const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          if (sortFn) items.sort(sortFn);
          state[stateKey] = items;

          if (stateKey === 'anggota' && state.sessionUser?.role === 'siswa') {
            const updated = items.find(x => x.id === state.sessionUser.data.id);
            if (updated) state.sessionUser.data = updated;
          }
          if (stateKey === 'admins' && state.sessionUser?.role === 'admin') {
            const updated = items.find(x => x.id === state.sessionUser.data.id);
            if (updated) state.sessionUser.data = updated;
          }
          renderApp();
        }, (error) => {
          console.error(`Firestore listener error [${colName}]:`, error);
        });
      };

      bindCol('buku', 'buku', (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
      bindCol('kategori_buku', 'kategori', (a, b) => String(a.nama_kategori || '').localeCompare(String(b.nama_kategori || '')));
      bindCol('jenis_buku', 'jenis', (a, b) => String(a.nama_jenis || '').localeCompare(String(b.nama_jenis || '')));
      bindCol('klasifikasi_ddc', 'ddc', (a, b) => String(a.kode_ddc || '').localeCompare(String(b.kode_ddc || '')));
      bindCol('sumber_buku', 'sumber');
      bindCol('jurusan', 'jurusan', (a, b) => String(a.nama_jurusan || '').localeCompare(String(b.nama_jurusan || '')));
      bindCol('kelas', 'kelas', (a, b) => String(a.nama_kelas || '').localeCompare(String(b.nama_kelas || ''), undefined, { numeric: true }));
      bindCol('anggota', 'anggota', (a, b) => String(a.no_anggota || '').localeCompare(String(b.no_anggota || '')));
      bindCol('admin_users', 'admins');
      bindCol('peminjaman', 'peminjaman', (a, b) => String(b.tgl_pinjam || '').localeCompare(String(a.tgl_pinjam || '')));
      bindCol('kas', 'kas', (a, b) => String(b.tanggal || '').localeCompare(String(a.tanggal || '')));
      bindCol('pengunjung', 'pengunjung', (a, b) => `${b.tanggal} ${b.jam}`.localeCompare(`${a.tanggal} ${a.jam}`));
    }

    function renderCariBuku() {
      const f = state.filter;
      const q = f.q.trim().toLowerCase();
      const pen = f.penulis.trim().toLowerCase();

      let hasil = state.buku.filter(b => {
        if (f.kategori && b.id_kategori !== f.kategori) return false;
        if (f.jenis && b.id_jenis !== f.jenis) return false;
        if (pen && !(b.pengarang || '').toLowerCase().includes(pen)) return false;
        if (q) {
          const ddc = getDdcInfo(b.id_ddc);
          const hay = `${b.judul} ${b.pengarang} ${b.penerbit} ${b.isbn} ${b.rak} ${ddc?.kode_ddc || ''} ${ddc?.nama_ddc || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (f.urut === 'judul_asc') hasil.sort((a, b) => (a.judul || '').localeCompare(b.judul || ''));
      else if (f.urut === 'stok_desc') hasil.sort((a, b) => (Number(b.stok) || 0) - (Number(a.stok) || 0));

      const total = hasil.length;
      const totalHal = Math.max(1, Math.ceil(total / f.perHalaman));
      const hal = Math.min(f.halaman, totalHal);
      const start = (hal - 1) * f.perHalaman;
      const pageItems = hasil.slice(start, start + f.perHalaman);

      return `
        <section class="bg-gradient-to-r from-[#18365d] to-[#1768ad] text-white py-10 px-4">
          <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl sm:text-3xl font-extrabold">🔍 Cari Buku &amp; Katalog Digital (OPAC)</h1>
            <p class="text-sm text-blue-100 mt-1">Telusuri berdasarkan judul, mata pelajaran, penulis, ISBN, kategori, atau kode DDC. Ditemukan <b>${total}</b> buku.</p>
          </div>
        </section>

        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6 space-y-6">
          <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3">
            <input type="text" value="${escapeHtml(f.q)}" oninput="app.updateFilter('q', this.value)"
              placeholder="Kata kunci judul, mapel, penulis, ISBN, DDC..."
              class="lg:col-span-4 px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-[#1768ad]" />
            <select onchange="app.updateFilter('kategori', this.value)" class="lg:col-span-3 px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="">Semua Kategori</option>
              ${state.kategori.map(k => `<option value="${k.id}" ${f.kategori === k.id ? 'selected' : ''}>${escapeHtml(k.nama_kategori)}</option>`).join('')}
            </select>
            <select onchange="app.updateFilter('jenis', this.value)" class="lg:col-span-2 px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="">Semua Jenis</option>
              ${state.jenis.map(j => `<option value="${j.id}" ${f.jenis === j.id ? 'selected' : ''}>${escapeHtml(j.nama_jenis)}</option>`).join('')}
            </select>
            <select onchange="app.updateFilter('urut', this.value)" class="lg:col-span-2 px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
              <option value="terbaru" ${f.urut === 'terbaru' ? 'selected' : ''}>Terbaru</option>
              <option value="judul_asc" ${f.urut === 'judul_asc' ? 'selected' : ''}>Judul A - Z</option>
              <option value="stok_desc" ${f.urut === 'stok_desc' ? 'selected' : ''}>Stok Terbanyak</option>
            </select>
            <button onclick="app.resetFilter()" class="lg:col-span-1 py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">
              Reset
            </button>
          </div>

          ${f.penulis ? `
            <div class="flex items-center justify-between bg-blue-50 border border-blue-200 px-4 py-2.5 rounded-xl text-xs text-[#18365d]">
              <span>Menampilkan koleksi buku oleh penulis: <b>${escapeHtml(f.penulis)}</b></span>
              <button onclick="app.updateFilter('penulis', '')" class="font-bold text-rose-600 hover:underline">Hapus Filter Penulis</button>
            </div>
          ` : ''}

          ${pageItems.length === 0 ? `
            <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center">
              <p class="font-bold text-slate-700">Buku yang Anda cari tidak ditemukan.</p>
              <button onclick="app.resetFilter()" class="mt-3 px-4 py-2 rounded-xl bg-[#1768ad] text-white text-xs font-bold">Reset Pencarian</button>
            </div>
          ` : `
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5">
              ${pageItems.map(b => renderBookCardCompact(b)).join('')}
            </div>
          `}

          ${totalHal > 1 ? `
            <div class="flex flex-wrap justify-center items-center gap-1.5 pt-2">
              ${Array.from({ length: totalHal }, (_, i) => i + 1).map(p => `
                <button onclick="app.setPage(${p})"
                  class="w-9 h-9 rounded-xl text-xs font-bold transition ${
                    p === hal ? 'bg-[#18365d] text-white shadow-xs' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50'
                  }">${p}</button>
              `).join('')}
            </div>
          ` : ''}
        </section>
      `;
    }

      const adm = state.sessionUser?.data;
      if (!adm || state.sessionUser?.role !== 'admin') {
        state.view = 'admin_login';
        return renderAdminLogin();
      }

    function openModal(html) {
      const modal = document.getElementById('globalModal');
      const box = document.getElementById('globalModalBox');
      if (!modal || !box) return;
      box.innerHTML = html;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('globalModal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.getElementById('globalModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'globalModal') closeModal();
    });

    function compressImageFileToDataUrl(file, maxW = 320, maxH = 420) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxW || h > maxH) {
              const ratio = Math.min(maxW / w, maxH / h);
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        await updateDoc(pubDoc('peminjaman', idPinjam), {
          status: 'Dikembalikan', tgl_kembali_aktual: todayStr(), denda

        const bk = getBukuById(p.id_buku);

        if (denda > 0) {
          const agt = getAnggotaById(p.id_anggota);
          await addDoc(pubCol('kas'), {
            tanggal: todayStr(),
            keterangan: `Denda keterlambatan (${telat} hari) - ${agt?.nama || 'Siswa'}`,

        showToast(denda > 0 ? `Buku dikembalikan dengan denda ${formatRupiah(denda)} masuk ke Kas.` : 'Buku berhasil dikembalikan tepat waktu!');

    function renderApp() {
      const root = document.getElementById('appRoot');
      if (!root) return;

      if (state.view === 'admin_panel') {
        root.innerHTML = renderAdminPanel();
        return;
      }

      let mainContent = '';
      if (state.view === 'beranda') mainContent = renderBeranda();
      else if (state.view === 'cari') mainContent = renderCariBuku();
      else if (state.view === 'koleksi') mainContent = renderKoleksiBuku();
      else if (state.view === 'penulis') mainContent = renderSemuaPenulis();
      else if (state.view === 'absen') mainContent = renderAbsenPengunjung();
      else if (state.view === 'siswa_auth') mainContent = renderSiswaAuth();
      else if (state.view === 'siswa_portal') mainContent = renderSiswaPortal();
      else if (state.view === 'admin_login') mainContent = renderAdminLogin();
      else mainContent = renderBeranda();

      root.innerHTML = `
        ${renderPublicNavbar()}
        <main class="flex-1">${mainContent}</main>
        ${renderFooter()}
      `;
    }

    async function bootstrap() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }
        await ensureInitialSeedData();
        initRealtimeListeners();
      } catch (err) {
        console.error('Bootstrap error:', err);
        renderApp();
      }
    }

    bootstrap();
  </script>
</body>
</html>
